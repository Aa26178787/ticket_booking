services:
  api:
    build: ./api
    environment:
      REDIS_HOST: redis
      HOLD_SECONDS: ${HOLD_SECONDS:-300}
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always

volumes:
  redis_data: